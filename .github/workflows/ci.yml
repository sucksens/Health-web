name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint backend (ruff)
        run: ruff check backend/app/

      - name: Test backend (pytest)
        run: pytest
        working-directory: backend
        env:
          DB_ENGINE: sqlite
          DATABASE_URL: sqlite:///test.db
          JWT_SECRET_KEY: test-secret-key-for-ci-only

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Typecheck frontend (astro check)
        run: npm run typecheck
        working-directory: frontend

      - name: Test frontend (vitest)
        run: npm run test
        working-directory: frontend

  publish:
    name: Build & Publish Docker Images
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set image names (lowercase)
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND=${{ env.REGISTRY }}/${OWNER}/health-backend" >> "$GITHUB_OUTPUT"
          echo "FRONTEND=${{ env.REGISTRY }}/${OWNER}/health-frontend" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.images.outputs.BACKEND }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.images.outputs.BACKEND }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.images.outputs.FRONTEND }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.images.outputs.FRONTEND }}:latest
